[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hunch"
version = "0.0.1"
description = "Local AI with a human-like memory (see docs/design.md)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Berk" }]
# torch is installed separately from the PyTorch CUDA index, see README.
dependencies = [
    "numpy>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.9",
]

[project.optional-dependencies]
llm = [
    "transformers>=4.57",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    # Fast Gated DeltaNet kernels (Triton). Verified natively on Windows in phase 0.
    "flash-linear-attention==0.5.2",
    "triton-windows==3.8.0.post29; sys_platform == 'win32'",
]
# Phase 6: scheduled follow-ups (APScheduler with a SQLite job store) and the Telegram channel.
telegram = [
    "apscheduler==3.11.3",
    "sqlalchemy>=2.0",
    "python-telegram-bot==22.8",
]
dev = [
    "matplotlib>=3.9",  # scripts/simulate_recall.py plots
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hunch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not golden and not slow'"
# Test levels (CLAUDE.md, "Test levels"): L1 unit (default run), L2 one area (-m "<area> and not golden"),
# L3 GPU regression set (-m "golden and regression" --quick), L4 phase end (-m golden + eval).
markers = [
    "gpu: needs the CUDA GPU (deselect with -m 'not gpu')",
    "golden: behavioural regression tests with the real model; run with -m golden",
    "slow: needs a downloaded model on CPU (embeddings); run with -m slow",
    "regression: the small GPU regression set (L3), run with -m 'golden and regression' --quick",
    "values: core values, amendments, value gate, no write path to core/ (area)",
    "memory: memory store, encoding, embeddings (area)",
    "recall: activation, cues, dates, involuntary recall, simulation (area)",
    "pipeline: turn pipeline, prompts, candidate filter, runtime/CLI (area)",
    "hunch: drive, modulation, hunch, reflection (area)",
    "honesty: invented memory, memory denial, honest admissions (area)",
    "evalset: eval/ runner, scoring, the eval set itself (area)",
    "infra: config, LLM kernels (area)",
    "mood: global mood, relationship state, hostility/apology signals (area)",
    "privacy: privacy profile, categories, mediation, disclosure gate (area)",
    "forget: user and admin forget (area)",
    "loops: open loops, initiative budget, follow-up scheduling (area)",
    "channels: chat channel, conversations, starters, admin commands (area)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "eval"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The project is multilingual (TR/DE/EN): Turkish dotless ı etc. are intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["hunch", "eval", "scripts"]

[tool.ruff.lint.per-file-ignores]
"src/hunch/pipeline/checks.py" = ["SIM905"]  # whitespace-split word lists read better than list literals
"src/hunch/pipeline/filter.py" = ["SIM905"]
"src/hunch/values/gate.py" = ["E501"]  # the judge prompt is model text, one rule per line
"scripts/simulate_recall.py" = ["E501"]  # hand-written memory table: one memory per line
"src/hunch/recall/cues.py" = ["E501"]  # the extraction prompt is model text, one rule per line

[tool.ruff.format]
quote-style = "double"
