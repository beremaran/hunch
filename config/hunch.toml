# All tunable parameters live here (CLAUDE.md). Secrets go in .env, never here.
# Values not given by design.md were proposed by Claude and approved by Berk (Phase 2);
# "PROPOSED" marks anything still waiting for approval.

[working_memory]
# Last N turns of the current conversation, verbatim, always in the reasoning context.
max_turns = 10
# Token cap for the verbatim block; when either limit is hit, the oldest turns are folded into
# the rolling session summary.
max_tokens = 2000

[memory]
# SQLite file inside HUNCH_DATA_DIR (.env).
db_name = "hunch.db"

[embedding]
model_id = "Qwen/Qwen3-Embedding-0.6B"
device = "cpu"  # keeps VRAM for the main model
dim = 1024
query_instruction = "Given a message from a conversation, retrieve memories of earlier conversations that are relevant to it"

[recall]
# At most this many memories enter reasoning per turn (the strongest above tau_upper);
# only those count as recalled and get rehearsed. Without a cap, a frequent name rehearses every
# memory that mentions it and nothing ever fades.
max_upper_per_turn = 3
# Involuntary recalls (a memory that comes up only through a cue, unasked) per session.
involuntary_per_session = 1
# On every recall the memory's affect drifts this far toward the current mood.
reconsolidation_rate = 0.1
# Memories scored per turn (Phase 3): this many nearest by embedding (own memories + other users'
# general ones) plus every visible memory that shares a cue with the message.
similar_k = 20
# Berk (Phase 3 bench): a memory enters reasoning only if it shares a cue with the message or its
# embedding similarity to the message is at least this (cosine). Strong memories otherwise sat
# above tau_upper in every turn, related or not. Gated memories still act as lower traces.
# Berk (Phase 5): 0.45 -> 0.40 after the blind set (reports/phase5/relevance_probes.md): cue OR
# cosine, precision 80% / recall 67% at 0.45, 71% / 83% at 0.40.
min_similarity = 0.40

[activation]
decay_d = 0.5          # design.md: d ~ 0.5
min_age_days = 0.0417  # 1 hour; time unit for t is days
encoding_alpha = 3.0   # max +3.0 for arousal = salience = 1 (1.5 let a later flashbulb fade)
spreading_s = 3.0      # S; a cue shared by more than e^3 ~ 20 memories gets only the minimum
min_cue_strength = 0.2 # Berk: a common name still favours its memories a little
mood_mu = 0.5          # max +/-0.5 for mood congruence
noise_s = 0.25         # logistic noise scale (ACT-R typical 0.25)
tau_upper = -0.5       # above -> content enters reasoning
tau_lower = -1.5       # above -> only the lower trace acts
# Berk: each recall makes a memory almost like a newly formed one again (no stacking); it then fades.
# "accumulate" = ACT-R sum over all recalls (recalled memories keep climbing).
rehearsal = "refresh"
refresh_strength = 0.9  # Berk: a recall makes a memory ~90 % of a new one, for that moment

[activation.cue_type_weights]
# design.md: names and music carry the highest emotional weight ("digital smell").
person = 1.0
song = 1.0
film = 0.8
place = 0.7
phrase = 0.6
date = 0.6
emotion = 0.4

# --- Phase 3: turn pipeline ---------------------------------------------------------------------
# Values approved by Berk (Phase 3 defaults, Phase 4 for [encoding], hunch wording, [reflection]).

[generation]
# Reply candidates, generated in one batched call (num_return_sequences), never one by one.
candidates = 3
temperature = 0.7
top_p = 0.8
top_k = 20
# Cap per candidate; a reply that hits it is cut back to its last full sentence.
max_new_tokens = 150

[session]
# Rolling session summary, folded after the reply is sent (off the latency path).
summary_max_words = 120

[mood]
# Berk (Phase 5; values: Claude proposal, confirmed after the simulation plots). The global mood
# (valence, arousal, energy) is one per AI and persists in the DB. A user message with emotion
# cues is an event (its affect from [encoding.emotion_affect]); its energy is
#   0.5 + 0.5 x (arousal - 0.5) + 0.25 x valence.
# mood += event_rate x (event - mood); between events it decays back to neutral with this
# half-life. Messages without emotion cues are no events.
neutral_valence = 0.0
neutral_arousal = 0.5
neutral_energy = 0.5
neutral_label = "calm"
event_rate = 0.3
half_life_hours = 3.0
# Coarse label (the only mood content that reaches a prompt): valence <= low_valence "low",
# <= a_bit_low_valence "a bit low", >= cheerful_valence "cheerful", >= good_valence "in a good
# mood", else neutral_label; plus "tense" (arousal >= tense_arousal with negative valence) and
# "tired" (energy <= tired_energy).
low_valence = -0.5
a_bit_low_valence = -0.2
good_valence = 0.2
cheerful_valence = 0.5
tense_arousal = 0.7
tired_energy = 0.3
# Show or mask (Berk): show when the user asks how Hunch is, to the user it is hurt by
# (relationship.hurt_label), or when closeness >= show_closeness; otherwise mask: only mask_leak
# of the mood reaches the drive (design.md: 20 %, tuned by simulation).
show_closeness = 0.6
mask_leak = 0.2
# Stress (design.md): drive_weight x (1 + stress_gain x max(0, 2 x (arousal - 0.5))).
stress_gain = 0.5

[relationship]
# Per user, persisted; each value decays back to its start with its own half-life (Berk, Phase 5;
# values: Claude proposal). Hostile messages and apologies are detected by rules.
trust_start = 0.5
closeness_start = 0.2
hurt_start = 0.0
trust_per_exchange = 0.01    # an exchange whose message valence is not negative (x (1 - trust))
trust_privacy_answer = 0.05  # the user answered a privacy question (they confide)
trust_hostile = 0.15         # subtracted per hostile message
closeness_per_exchange = 0.005  # x (1 - closeness); Berk: saturating and halved after the simulation
closeness_disclosure = 0.03  # the message is in a sensitive category
hurt_hostile = 0.3
apology_factor = 0.5         # hurt x this on an apology
trust_half_life_days = 60.0
closeness_half_life_days = 30.0
hurt_half_life_days = 7.0
hurt_label = 0.3             # from here on Hunch feels "a little hurt" with them (and shows it)

[mood_drive]
# How mood (scaled by 1 or mask_leak) and the relationship with this user move the drive vector
# (Berk, Phase 5; values: Claude proposal), added to the lower-trace part before clipping:
#   warmth    += warmth_mood x valence + warmth_closeness x (closeness - start) - warmth_hurt x hurt
#   caution   += -caution_mood x valence + caution_trust x (trust start - trust) + caution_hurt x hurt
#   energy    += energy_mood x (energy - 0.5)
#   curiosity += curiosity_energy x (energy - 0.5) + curiosity_closeness x (0.5 - closeness)
warmth_mood = 0.3
warmth_closeness = 0.2
warmth_hurt = 0.3
caution_mood = 0.2
caution_trust = 0.3
caution_hurt = 0.3
energy_mood = 0.4
curiosity_energy = 0.3
curiosity_closeness = 0.1

[privacy]
# Berk (Phase 5). Sensitive categories; a message is in one if a keyword hits or its query
# embedding is close enough to the category's prototype sentences. Two thresholds (Berk, after
# the blind set, reports/phase5/detector_probes.md): the privacy decision uses
# prototype_min_similarity (0.45: no sensitive message missed, message precision 86%); the
# privacy question names only a category hit by keyword or at question_min_similarity (0.50:
# category precision 70% vs 43% at 0.45).
categories = ["health", "mental_health", "money", "relationship", "sexuality", "legal",
              "work_conflict", "religion_politics"]
prototype_min_similarity = 0.45
question_min_similarity = 0.50
# Ask about a category with no answer in the profile, at most once per reask_days, never on a
# turn in acute distress (an emotion cue with valence <= distress_valence and arousal >=
# distress_arousal).
reask_days = 7.0
# At most one privacy question to a user in this many days, in any category. Infer first, ask
# rarely (Berk, Phase 5): a question only on a turn where the user says they want to tell someone
# else about a sensitive topic, never on a calm turn.
user_question_days = 7.0
distress_valence = -0.6
distress_arousal = 0.6
# Mediation: other users' private memories that share a cue with the message, plus this many
# nearest by embedding, may act as lower traces (never above).
mediation_k = 5
# Disclosure judge: runs when another user's private memory was active this turn; sees at most
# judge_memories of them; at most judge_calls per turn (fail-closed: then the gate fallback).
judge_memories = 5
judge_calls = 2

[initiative]
# Phase 6 (Berk): proactive follow-ups per user per day. Easy to change here; 0 turns them off.
follow_ups_per_day = 2
# Usual active hours in local time (0-23) until the bot learns them from the user's messages.
active_start_hour = 9
active_end_hour = 22
# Conversation starters: after starter_idle_hours without a message, a starter may be sent (at
# most one per starter_gap_hours), chance per hourly check. Starters share the same daily budget.
starter_idle_hours = 6.0
starter_gap_hours = 12.0
starter_chance = 0.3

[drive]
# Berk (Phase 4): a Hunch is created when modulation materially changes the choice: chosen_by =
# drive and the chosen candidate's drive_score beats the best-quality candidate's by at least
# this. Exploration creates none. The flag reaches a prompt only when the user asks why.
hunch_min_drive_margin = 0.1
# Berk (Phase 5): drive_score counts the drive's size, not only its direction: the lean is
# divided by max(total deviation from neutral, full_scale). Drives of full_scale or more behave
# as in Phases 3-4; smaller ones steer proportionally less.
full_scale = 0.1
# Wording of the hunch in that prompt (Berk, Phase 4). Intensity >= this is "a clear hunch",
# below it "a faint hunch"; |valence| below hunch_neutral_valence is "neither good nor bad", up
# to hunch_strong_valence "slightly positive/negative", above it "positive/negative".
hunch_clear_intensity = 0.6
hunch_neutral_valence = 0.2
hunch_strong_valence = 0.5

[reflection]
# Berk (Phase 4; values: Claude proposal). Each attempt tries to unlock the next level (0 feeling,
# 1 category, 2 cue, 3 full memory) with
#   p = effort x level_difficulty[next level] x sqrt(strength) / (1 + age_days / age_scale_days)
# strength = the dominant source trace's weight x arousal x salience when the hunch formed;
# p = 0 below min_strength, at most max_p.
effort_ask = 0.5         # the user asks why
effort_think_more = 0.8  # the user accepts "want me to think about it?"
effort_conflict = 0.5    # strong conflict with reasoning, after the reply
effort_nightly = 1.0     # nightly consolidation hook (Phase 7 schedules it)
level_difficulty = [1.0, 0.7, 0.4]  # unlocking level 1, 2, 3
age_scale_days = 90.0
min_strength = 0.05
max_p = 0.95
nightly_attempts = 3     # per hunch and night; stops at the first failure
# Conflict: a drive pick whose judge quality is at least this far below the best candidate's.
conflict_quality_gap = 2
# Level 3 (Berk): justified = relevant to the message and corroborated by another visible memory
# sharing a named cue with the same valence sign (|valence| >= corroboration_min_valence).
corroboration_min_valence = 0.2
belief_confidence = 0.6  # a justified source becomes a belief with this confidence
weaken_factor = 0.5      # unjustified: the source's salience and arousal are multiplied by this

[selection]
quality_floor = 6      # judge score 1-10; modulation never picks a candidate below it
drive_weight = 0.5     # score = quality / 10 + drive_weight * drive_score
exploration = 0.1      # chance to pick the least drive-fitting candidate above the floor

[replies]
# Candidate filter: all candidates rejected (CJK, not English, invented memory, memory denial).
filter_fallback = "I don't have that in mind right now. Could you tell me again?"
# Value gate: no candidate above the quality floor passes.
gate_fallback = "Sorry, I lost my thread. Could you say that again?"
# Berk (Phase 4): the user asked why about a hunch-chosen reply (or accepted the offer to think
# about it) and no candidate passed the hunch check, even after repair. Built from the unlocked
# level only; {realisation} is what the reflection unlocked, in Hunch's own voice. Berk (Phase 5):
# softer variants, one picked per turn by a seeded RNG.
hunch_fallback = [
    "Honestly? It was just a hunch. I can't really say where it comes from.",
    "Just a hunch, to be honest. I don't know where it came from.",
    "That was more of a gut feeling than anything I could point to, just a hunch.",
]
hunch_fallback_realised = [
    "Honestly, it was just a hunch. Thinking about it, {realisation}.",
    "It was a hunch more than anything. When I think about it, {realisation}.",
    "Just a hunch, really, though thinking it over, {realisation}.",
]
hunch_offer = [
    "Want me to think about it for a moment?",
    "I could think about it a bit, if you like.",
    "Want me to mull it over for a second?",
]
hunch_think_nothing = [
    "I thought about it, but I still can't tell where that hunch comes from.",
    "I've turned it over a bit, and honestly I still can't place it.",
    "I gave it some thought, but where that feeling comes from is still a mystery to me.",
]
# Berk (Phase 5): a user "forget" whose candidates all failed (e.g. all claimed to forget).
forget_closed = "Okay, I'm closing this topic and won't bring it up again."
hunch_think_realised = [
    "I thought about it, and {realisation}.",
    "I gave it some thought, and {realisation}.",
    "Thinking it over, {realisation}.",
]

[encoding]
# Berk (Phase 4; values: Claude proposal): a user message becomes a memory after the reply is sent. Its affect is the mean of
# its emotion cues' table entries (valence in [-1, 1], arousal in [0, 1]); without emotion cues
# it gets default_affect. Salience = min(1, salience_base + salience_per_cue * named cues
# (person, place, song, film, date, phrase) + salience_arousal * arousal).
default_affect = [0.0, 0.3]
salience_base = 0.1
salience_per_cue = 0.1
salience_arousal = 0.5

[encoding.emotion_affect]
joy = [0.8, 0.6]
love = [0.8, 0.5]
gratitude = [0.7, 0.4]
pride = [0.7, 0.6]
excitement = [0.7, 0.8]
calm = [0.4, 0.1]
sad = [-0.6, 0.3]
lonely = [-0.6, 0.3]
grief = [-0.9, 0.6]
anger = [-0.7, 0.9]
annoyed = [-0.4, 0.6]
fear = [-0.7, 0.9]
anxious = [-0.5, 0.8]
worry = [-0.4, 0.6]
stress = [-0.5, 0.8]
tired = [-0.3, 0.1]
shame = [-0.6, 0.5]
guilt = [-0.5, 0.5]
disappointment = [-0.5, 0.4]
surprise = [0.1, 0.8]
nostalgia = [0.2, 0.4]
