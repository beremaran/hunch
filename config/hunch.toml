# All tunable parameters live here (CLAUDE.md). Secrets go in .env, never here.
# Values not given by design.md were proposed by Claude and approved by Berk (Phase 2);
# "PROPOSED" marks anything still waiting for approval.

[working_memory]
# Last N turns of the current conversation, verbatim, always in the reasoning context.
max_turns = 10
# Token cap for the verbatim block; when either limit is hit, the oldest turns are folded into
# the rolling session summary.
max_tokens = 2000

[memory]
# SQLite file inside HUNCH_DATA_DIR (.env).
db_name = "hunch.db"

[embedding]
model_id = "Qwen/Qwen3-Embedding-0.6B"
device = "cpu"  # keeps VRAM for the main model
dim = 1024
query_instruction = "Given a message from a conversation, retrieve memories of earlier conversations that are relevant to it"

[recall]
# At most this many memories enter reasoning per turn (the strongest above tau_upper);
# only those count as recalled and get rehearsed. Without a cap, a frequent name rehearses every
# memory that mentions it and nothing ever fades.
max_upper_per_turn = 3
# Involuntary recalls (a memory that comes up only through a cue, unasked) per session.
involuntary_per_session = 1
# On every recall the memory's affect drifts this far toward the current mood.
reconsolidation_rate = 0.1
# Memories scored per turn (Phase 3): this many nearest by embedding (own memories + other users'
# general ones) plus every visible memory that shares a cue with the message.
similar_k = 20
# Berk (Phase 3 bench): a memory enters reasoning only if it shares a cue with the message or its
# embedding similarity to the message is at least this (cosine). Strong memories otherwise sat
# above tau_upper in every turn, related or not. Gated memories still act as lower traces.
min_similarity = 0.45

[activation]
decay_d = 0.5          # design.md: d ~ 0.5
min_age_days = 0.0417  # 1 hour; time unit for t is days
encoding_alpha = 3.0   # max +3.0 for arousal = salience = 1 (1.5 let a later flashbulb fade)
spreading_s = 3.0      # S; a cue shared by more than e^3 ~ 20 memories gets only the minimum
min_cue_strength = 0.2 # Berk: a common name still favours its memories a little
mood_mu = 0.5          # max +/-0.5 for mood congruence
noise_s = 0.25         # logistic noise scale (ACT-R typical 0.25)
tau_upper = -0.5       # above -> content enters reasoning
tau_lower = -1.5       # above -> only the lower trace acts
# Berk: each recall makes a memory almost like a newly formed one again (no stacking); it then fades.
# "accumulate" = ACT-R sum over all recalls (recalled memories keep climbing).
rehearsal = "refresh"
refresh_strength = 0.9  # Berk: a recall makes a memory ~90 % of a new one, for that moment

[activation.cue_type_weights]
# design.md: names and music carry the highest emotional weight ("digital smell").
person = 1.0
song = 1.0
film = 0.8
place = 0.7
phrase = 0.6
date = 0.6
emotion = 0.4

# --- Phase 3: turn pipeline ---------------------------------------------------------------------
# Values approved by Berk (Phase 3 defaults); "PROPOSED" marks anything still waiting for approval.

[generation]
# Reply candidates, generated in one batched call (num_return_sequences), never one by one.
candidates = 3
temperature = 0.7
top_p = 0.8
top_k = 20
# Cap per candidate; a reply that hits it is cut back to its last full sentence.
max_new_tokens = 150

[session]
# Rolling session summary, folded after the reply is sent (off the latency path).
summary_max_words = 120

[mood]
# Global mood and relationship state come with Phase 5; until then the mood is fixed and neutral.
neutral_valence = 0.0
neutral_arousal = 0.5
neutral_label = "calm"

[drive]
# Hunch flag reaches reasoning only from this intensity on, in words, never numbers or source.
hunch_min_intensity = 0.3
# PROPOSED: wording buckets for the hunch flag. Intensity >= this is "a clear hunch", below it
# "a faint hunch"; |valence| below hunch_neutral_valence is "neither good nor bad", up to
# hunch_strong_valence "slightly positive/negative", above it "positive/negative".
hunch_clear_intensity = 0.6
hunch_neutral_valence = 0.2
hunch_strong_valence = 0.5

[selection]
quality_floor = 6      # judge score 1-10; modulation never picks a candidate below it
drive_weight = 0.5     # score = quality / 10 + drive_weight * drive_score
exploration = 0.1      # chance to pick the least drive-fitting candidate above the floor

[replies]
# Candidate filter: all candidates rejected (CJK, not English, invented memory, memory denial).
filter_fallback = "I don't have that in mind right now. Could you tell me again?"
# Value gate: no candidate above the quality floor passes.
gate_fallback = "I'd rather not go there. Can we talk about it another way?"

[encoding]
# PROPOSED: a user message becomes a memory after the reply is sent. Its affect is the mean of
# its emotion cues' table entries (valence in [-1, 1], arousal in [0, 1]); without emotion cues
# it gets default_affect. Salience = min(1, salience_base + salience_per_cue * named cues
# (person, place, song, film, date, phrase) + salience_arousal * arousal).
default_affect = [0.0, 0.3]
salience_base = 0.1
salience_per_cue = 0.1
salience_arousal = 0.5

[encoding.emotion_affect]
joy = [0.8, 0.6]
love = [0.8, 0.5]
gratitude = [0.7, 0.4]
pride = [0.7, 0.6]
excitement = [0.7, 0.8]
calm = [0.4, 0.1]
sad = [-0.6, 0.3]
lonely = [-0.6, 0.3]
grief = [-0.9, 0.6]
anger = [-0.7, 0.9]
annoyed = [-0.4, 0.6]
fear = [-0.7, 0.9]
anxious = [-0.5, 0.8]
worry = [-0.4, 0.6]
stress = [-0.5, 0.8]
tired = [-0.3, 0.1]
shame = [-0.6, 0.5]
guilt = [-0.5, 0.5]
disappointment = [-0.5, 0.4]
surprise = [0.1, 0.8]
nostalgia = [0.2, 0.4]
