[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hunch"
version = "0.0.1"
description = "Local AI with a human-like memory (see docs/design.md)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Berk" }]
# torch is installed separately from the PyTorch CUDA index, see README.
dependencies = [
    "numpy>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.9",
]

[project.optional-dependencies]
llm = [
    "transformers>=4.57",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    # Fast Gated DeltaNet kernels (Triton). Verified natively on Windows in phase 0.
    "flash-linear-attention==0.5.2",
    "triton-windows==3.8.0.post29; sys_platform == 'win32'",
]
dev = [
    "matplotlib>=3.9",  # scripts/simulate_recall.py plots
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hunch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not golden and not slow'"
markers = [
    "gpu: needs the CUDA GPU (deselect with -m 'not gpu')",
    "golden: behavioural regression tests with the real model; run with -m golden",
    "slow: needs a downloaded model on CPU (embeddings); run with -m slow",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "eval"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The project is multilingual (TR/DE/EN): Turkish dotless ı etc. are intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["hunch", "eval", "scripts"]

[tool.ruff.lint.per-file-ignores]
"eval/scoring.py" = ["SIM905"]  # whitespace-split word lists read better than list literals
"scripts/simulate_recall.py" = ["E501"]  # hand-written memory table: one memory per line
"src/hunch/recall/cues.py" = ["E501"]  # the extraction prompt is model text, one rule per line

[tool.ruff.format]
quote-style = "double"
